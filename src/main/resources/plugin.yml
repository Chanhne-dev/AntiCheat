name: AntiCheat
version: ${project.version}
main: chanhne.AntiCheat.Mainplugin
folia-supported: true
api-version: '1.21'
description: Tự động phát hiện và xóa các item bất hợp pháp trong Inventory. Support paper/folia
author: Chanhne
depend: [BetterBan]        # bắt buộc phải có BetterBan

commands:
  anticheat:
    description: Lệnh quản lý AntiCheat
    aliases: [at]
    usage: |
      /<command> reload
      /<command> check <player> <seconds>
    permission: anticheat.admin

permissions:
  anticheat.admin:
    description: Quyền quản trị plugin
    default: op