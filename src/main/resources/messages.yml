# ============================================
# PREFIX CHUNG
# ============================================
prefix: "&c[SunFlower] &r"

# ============================================
# LỆNH PLUGIN
# ============================================
plugin:
    usage: "&cSử dụng: /{label} <check|reload> [player]"
    invalid-subcommand: "&cLệnh con không hợp lệ. Dùng: check, reload"
    no-permission: "&cBạn không có quyền!"
    reload-success: "&aĐã reload config thành công!"

# ============================================
# LỆNH CHECK
# ============================================
check:
    checking-all: "&eĐang kiểm tra tất cả người chơi..."
    player-not-found: "&cKhông tìm thấy người chơi: &f{player}"
    violations-found: "&cVi phạm: &f{player} &c({count} lỗi)"
    player-violations-header: "&cPhát hiện &f{count}&c vi phạm của &f{player}&c:"
    no-violations: "&aKhông phát hiện vi phạm nào!"
    player-clean: "&a{player} &akhông có vi phạm!"
    violation-slot: "    &7Slot {slot} &e{reason}"
    # Dùng để hiển thị chi tiết từng vi phạm (phần >>)
    violation-detail: "    &7>> &e{reason}"

# ============================================
# CẢNH BÁO VI PHẠM (KHI QUÉT TỰ ĐỘNG)
# ============================================
warning:
    illegal-item-pickup: "§cBạn không thể nhặt item bất hợp pháp: &e{item}"
    illegal-item-found: "&c⚠ Phát hiện item bất hợp pháp: &e{item} &ctại slot {slot}!"
    inventory-cleared: "&cToàn bộ inventory của bạn đã bị xóa do chứa item bất hợp pháp!"
    admin-notify: "&eNgười chơi &f{player} &eđã bị ban do dùng &f{item}&e!"
    illegal-potion: "&cBình thuốc cấp độ quá cao: &e{item} &c(Level {level})"
    illegal-enchant: "&cEnchantment không hợp lệ: &e{enchant} &clevel {level} trên &e{item}"
    illegal-enchant-item: "&cItem bị cấm enchant: &e{item}"

# ============================================
# THÔNG BÁO KHI BAN
# ============================================
ban:
    player-banned: "&cBạn đã bị ban &e{duration} phút &cdo sử dụng item bất hợp pháp!"
    player-banned-broadcast: "&c[SunFlower] &e{player} &bđã bị ban do sử dụng item bất hợp pháp!"